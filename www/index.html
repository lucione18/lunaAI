<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo">&#9835;</span> Luna</div>
    <div class="head-right"><span id="wchip" class="chip small hidden"></span><button id="btn-settings" class="icon" aria-label="Settings"></button></div>
  </header>

  <main>
    <!-- ROOM -->
    <section id="tab-room" class="tab active">
      <div class="stage-wrap">
        <div class="stage" id="stageBox">
          <canvas id="stage" width="380" height="220"></canvas>
          <div id="bubble" class="bubble hidden"></div>
          <div id="notes"></div>
        </div>
      </div>
      <div class="chips" id="actions"></div>
      <div class="card nowcard" id="nowcard">
        <div class="cover" id="nc-cover"></div>
        <div class="grow"><div class="title" id="nc-title">Nothing playing</div><div class="sub" id="nc-sub">Add songs from your phone to start</div><div class="sub dim" id="nc-mood"></div></div>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="tab-lib" class="tab">
      <div class="searchbar"><input id="q" type="search" placeholder="Search songs, artists, albums" autocomplete="off"><button id="btn-add" class="pill">+ Add songs</button></div>
      <div class="chips scroll" id="libtabs"></div>
      <div id="liblist"></div>
    </section>

    <!-- LYRICS -->
    <section id="tab-lyrics" class="tab">
      <div class="lyr-head"><div><div class="title" id="ly-title">Lyrics</div><div class="sub" id="ly-sub"></div></div>
        <div class="row"><button class="pill" id="ly-edit">Add my own</button><button class="pill ghost" id="ly-find">Find online</button></div></div>
      <div id="ly-body" class="lyrics"></div>
      <div id="ly-editor" class="hidden"><textarea id="ly-text" placeholder="Type or paste the lyrics here. For line-by-line timing use [mm:ss.xx] before each line."></textarea>
        <div class="row"><button class="pill" id="ly-save">Save</button><button class="pill ghost" id="ly-cancel">Cancel</button><button class="pill ghost" id="ly-clear">Remove mine</button></div></div>
    </section>

    <!-- CHAT -->
    <section id="tab-chat" class="tab">
      <div id="log" class="log"></div>
      <div class="chips scroll" id="quick"></div>
      <form id="chatform" class="chatform"><input id="chatin" placeholder="Say something to Luna..." autocomplete="off" enterkeyhint="send"><button type="button" id="btn-mic" class="icon round" aria-label="Voice"></button><button class="icon round primary" aria-label="Send" id="btn-send"></button></form>
    </section>

    <!-- WARDROBE -->
    <section id="tab-wardrobe" class="tab">
      <div class="wardrobe">
        <div class="wprev"><canvas id="wcanvas" width="160" height="184"></canvas><button class="pill" id="w-random">Surprise me</button></div>
        <div class="wmain"><div class="chips scroll" id="wcats"></div><div id="wgrid" class="grid"></div></div>
      </div>
    </section>
  </main>

  <div id="miniplayer" class="mini">
    <div class="mprog" id="mprog"><i id="mprog-fill"></i></div>
    <div class="mrow">
      <button class="mleft" id="mini-open"><div class="cover small" id="mini-cover"></div><div class="grow"><div class="title" id="mini-title">Nothing playing</div><div class="sub" id="mini-sub">Tap + Add songs in Library</div></div></button>
      <button class="icon" id="mini-like" aria-label="Like"></button>
      <button class="icon" id="mini-prev" aria-label="Previous"></button>
      <button class="icon big" id="mini-play" aria-label="Play"></button>
      <button class="icon" id="mini-next" aria-label="Next"></button>
    </div>
  </div>

  <nav id="nav"></nav>

  <!-- full player -->
  <div id="sheet-now" class="sheet hidden"><div class="sheet-body">
    <div class="sheet-top"><button class="icon" id="now-close" aria-label="Close"></button><div class="sub" id="now-q">Now playing</div><button class="icon" id="now-menu" aria-label="More"></button></div>
    <div class="art" id="now-art"></div>
    <div class="title big" id="now-title">Nothing playing</div><div class="sub" id="now-sub"></div>
    <div class="seek"><input type="range" id="now-seek" min="0" max="1000" value="0"><div class="times"><span id="now-t0">0:00</span><span id="now-t1">0:00</span></div></div>
    <div class="ctrl"><button class="icon" id="now-shuf"></button><button class="icon" id="now-prev"></button><button class="icon huge" id="now-play"></button><button class="icon" id="now-next"></button><button class="icon" id="now-rep"></button></div>
    <div class="ctrl2"><button class="icon" id="now-like"></button><div class="vol"><span id="vol-ico"></span><input type="range" id="now-vol" min="0" max="100"></div><button class="icon" id="now-pl" aria-label="Add to playlist"></button></div>
  </div></div>

  <div id="sheet-settings" class="sheet hidden"><div class="sheet-body pad">
    <div class="sheet-top"><div class="title big">Settings</div><button class="icon" id="set-close" aria-label="Close"></button></div>
    <label>Your name<input id="s-name" placeholder="What should I call you?"></label>
    <label>City (for weather)<input id="s-city" placeholder="e.g. Johannesburg"></label>
    <label>Hemisphere<select id="s-hemi"><option value="south">Southern</option><option value="north">Northern</option></select></label>
    <label>Room theme<select id="s-theme"></select></label>
    <label class="check"><input type="checkbox" id="s-season"> Seasons and holidays change her room and outfit</label>
    <label class="check"><input type="checkbox" id="s-voice"> Luna reads her replies out loud</label>
    <div class="two"><label>Bedtime hour<input id="s-bed" type="number" min="0" max="23"></label><label>Wake hour<input id="s-wake" type="number" min="0" max="23"></label></div>
    <label>Claude API key (optional, to chat about anything)<input id="s-key" type="password" placeholder="sk-ant-..." autocomplete="off"></label>
    <div class="sub dim">The key stays on this phone and is only sent to Anthropic.</div>
    <div class="row wrap"><button class="pill" id="set-add">Add songs</button><button class="pill ghost danger" id="set-clear">Remove all songs</button></div>
    <div class="sub dim" id="set-info"></div>
  </div></div>

  <div id="menu" class="menu hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav" multiple hidden>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
